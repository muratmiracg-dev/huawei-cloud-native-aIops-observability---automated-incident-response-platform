name: Bug report
description: Report a reproducible defect
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private telemetry, or customer data.
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: Include the component, version, and sanitized evidence.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: dropdown
    id: impact
    attributes:
      label: Reliability impact
      options:
        - No service impact
        - Limited degradation
        - SLO risk
        - Outage or integrity risk
    validations:
      required: true
