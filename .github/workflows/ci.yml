name: Quality and deployment validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python quality and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Tests and coverage
        run: pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Repository contract validation
        run: python scripts/validate_repository.py

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error
          retention-days: 14

  deployment:
    name: Deployment configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4.0.1
        with:
          version: v1.31.14

      - name: Render Kustomize
        run: |
          kubectl kustomize kubernetes/base > /tmp/huawei-aiops-kustomize.yaml
          test -s /tmp/huawei-aiops-kustomize.yaml

      - name: Set up Helm
        uses: azure/setup-helm@v4.3.1
        with:
          version: v3.18.4

      - name: Lint Helm
        run: helm lint helm/huawei-aiops --strict

      - name: Render Helm
        run: |
          helm template aiops helm/huawei-aiops \
            --namespace huawei-aiops \
            --values helm/huawei-aiops/values-huawei-cloud.yaml \
            > /tmp/huawei-aiops-rendered.yaml
          test -s /tmp/huawei-aiops-rendered.yaml

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.2

      - name: Terraform format
        run: terraform -chdir=terraform fmt -check -recursive

      - name: Terraform initialize
        run: terraform -chdir=terraform init -backend=false -input=false

      - name: Terraform validate
        run: terraform -chdir=terraform validate
