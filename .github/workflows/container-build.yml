name: Container build

on:
  push:
    branches: [main]
    paths:
      - "aiops/**"
      - "platform_core/**"
      - "services/**"
      - "docker/**"
      - "requirements.txt"
      - ".github/workflows/container-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "aiops/**"
      - "platform_core/**"
      - "services/**"
      - "docker/**"
      - "requirements.txt"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.service.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service:
          - {name: catalog-api, module: "services.catalog.main:app", port: 8001}
          - {name: orders-api, module: "services.orders.main:app", port: 8002}
          - {name: payments-api, module: "services.payments.main:app", port: 8003}
          - {name: aiops-api, module: "aiops.api:app", port: 8004}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3.11.1

      - name: Build without publishing
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: local/${{ matrix.service.name }}:${{ github.sha }}
          build-args: |
            APP_MODULE=${{ matrix.service.module }}
            APP_PORT=${{ matrix.service.port }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}
