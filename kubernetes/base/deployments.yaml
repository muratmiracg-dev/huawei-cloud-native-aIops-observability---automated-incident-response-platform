apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-api
  namespace: huawei-aiops
  labels: &catalog-labels
    app.kubernetes.io/name: catalog-api
    app.kubernetes.io/component: workload
    app.kubernetes.io/part-of: huawei-aiops-platform
    app.kubernetes.io/version: "1.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: catalog-api
  template:
    metadata:
      labels: *catalog-labels
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8001"
    spec:
      serviceAccountName: workload
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: catalog-api
          image: huawei-aiops/catalog-api:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8001, protocol: TCP}
          envFrom:
            - configMapRef: {name: platform-config}
          securityContext: &container-security
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 384Mi}
          readinessProbe: &catalog-ready
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          startupProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 5
            failureThreshold: 12
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
      topologySpreadConstraints: &spread
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: catalog-api
---
