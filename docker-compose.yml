name: huawei-cloud-aiops

x-app-base: &app-base
  restart: unless-stopped
  networks: [aiops]
  environment: &app-env
    ENVIRONMENT: local
    LOG_LEVEL: INFO
    ENABLE_TRACING: "true"
    ENABLE_FAULT_INJECTION: "true"
    OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    OTEL_SERVICE_NAMESPACE: huawei-aiops
    INCIDENT_AUTOMATION_MODE: dry-run
    CATALOG_URL: http://catalog-api:8001
    PAYMENTS_URL: http://payments-api:8003
  security_opt:
    - no-new-privileges:true
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777

services:
  catalog-api:
    <<: *app-base
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        APP_MODULE: services.catalog.main:app
        APP_PORT: 8001
    ports: ["8001:8001"]
    environment:
      <<: *app-env
      SERVICE_NAME: catalog-api

  orders-api:
    <<: *app-base
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        APP_MODULE: services.orders.main:app
        APP_PORT: 8002
    ports: ["8002:8002"]
    environment:
      <<: *app-env
      SERVICE_NAME: orders-api
    depends_on:
      catalog-api:
        condition: service_healthy
      payments-api:
        condition: service_healthy

  payments-api:
    <<: *app-base
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        APP_MODULE: services.payments.main:app
        APP_PORT: 8003
    ports: ["8003:8003"]
    environment:
      <<: *app-env
      SERVICE_NAME: payments-api

  aiops-api:
    <<: *app-base
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        APP_MODULE: aiops.api:app
        APP_PORT: 8004
    ports: ["8004:8004"]
    environment:
      <<: *app-env
      SERVICE_NAME: aiops-api

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.130.1
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./observability/opentelemetry/collector.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"
    networks: [aiops]
    depends_on: [tempo]

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports: ["9090:9090"]
    networks: [aiops]

  tempo:
    image: grafana/tempo:2.8.2
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports: ["3200:3200"]
    networks: [aiops]

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports: ["3000:3000"]
    networks: [aiops]
    depends_on: [prometheus, tempo]

networks:
  aiops:
    driver: bridge

volumes:
  prometheus-data:
  tempo-data:
  grafana-data:
