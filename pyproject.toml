[project]
name = "huawei-cloud-aiops-sre-platform"
version = "1.0.0"
description = "Cloud-native AIOps, observability and automated incident response reference platform for Huawei Cloud."
requires-python = ">=3.11"
authors = [{ name = "Murat Miraç Gedik" }]
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "integration: tests requiring local service dependencies",
  "contract: API and configuration contract tests",
]

[tool.coverage.run]
branch = true
source = ["platform_core", "services", "aiops"]
omit = ["*/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 85
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["presentations/build"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
"scripts/**/*.py" = ["S603", "S607"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
