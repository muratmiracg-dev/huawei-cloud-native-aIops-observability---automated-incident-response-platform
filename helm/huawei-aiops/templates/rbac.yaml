{{- if .Values.rbac.incidentResponder.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "huawei-aiops.fullname" . }}-incident-responder
  labels:
    {{- include "huawei-aiops.commonLabels" . | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale", "replicasets"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: [""]
    resources: ["pods", "events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "huawei-aiops.fullname" . }}-incident-responder
  labels:
    {{- include "huawei-aiops.commonLabels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: incident-responder
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "huawei-aiops.fullname" . }}-incident-responder
{{- end }}
