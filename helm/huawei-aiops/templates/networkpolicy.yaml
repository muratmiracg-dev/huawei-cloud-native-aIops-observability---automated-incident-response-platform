{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "huawei-aiops.fullname" . }}-default-deny
  labels:
    {{- include "huawei-aiops.commonLabels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "huawei-aiops.fullname" . }}-platform-traffic
  labels:
    {{- include "huawei-aiops.commonLabels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: {{ include "huawei-aiops.name" . }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: {{ include "huawei-aiops.name" . }}
      ports:
        {{- range $name, $service := .Values.services }}
        - {protocol: TCP, port: {{ $service.port }}}
        {{- end }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.monitoringNamespace }}
      ports:
        {{- range $name, $service := .Values.services }}
        - {protocol: TCP, port: {{ $service.port }}}
        {{- end }}
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: {{ include "huawei-aiops.name" . }}
      ports:
        - {protocol: TCP, port: 8001}
        - {protocol: TCP, port: 8003}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.monitoringNamespace }}
      ports:
        - {protocol: TCP, port: 4317}
{{- end }}
